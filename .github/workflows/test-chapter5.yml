name: Test library-backend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend dependencies
        run: npm ci
        working-directory: osa8/fs-graphql/library-backend
      - name: Run backend tests
        run: npm test
        working-directory: osa8/fs-graphql/library-backend